<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gal Guardians: Demon Purge — Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0e060c}
a{color:#f6e6be}a:hover{color:#f6e6be}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #f6e6be;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 915px; height: 412px; overflow: hidden; background: #0e060c; font-family: 'Cinzel', serif; color: #f6e6be; touch-action: none; user-select: none; -webkit-user-select: none">

<!-- Backdrop -->
<svg aria-hidden="true" width="915" height="412" viewBox="0 0 915 412" style="position: absolute; left: 0; top: 0">
<rect x="0" y="0" width="915" height="412" fill="#0e060c"></rect>
<circle cx="458" cy="148" r="96" fill="#230b1a"></circle>
</svg>

<!-- Full-screen game placeholder -->
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">
<span style="font-family: 'Cinzel', serif; font-size: 14px; font-weight: 700; letter-spacing: 5px; color: #7e6975; opacity: 0.75">[ GAL GUARDIANS ]</span>
</div>

<!-- Controls (opacity is a tweak) -->
<div style="position: absolute; inset: 0; opacity: {{op}}">

<!-- Input readout -->
<div style="position: absolute; left: 330px; top: 40px; width: 255px; height: 48px; box-sizing: border-box; padding: 3px 14px; border: 1.5px solid #8a6d3b; border-radius: 6px; background: #180912; box-shadow: 0 4px 0 #050204; display: flex; flex-direction: column; justify-content: center">
<span style="font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700; color: {{accent}}">{{last}}</span>
</div>

<!-- Emulator settings: ornate ruby-gold MENU pill -->
<button type="button" aria-label="Emulator settings (drag to move)" onPointerDown="{{menu.h.down}}" onPointerMove="{{menu.h.move}}" onPointerUp="{{menu.h.up}}" onPointerCancel="{{menu.h.up}}" onClick="{{menu.h.click}}" style="position: absolute; left: 414px; top: 2px; width: 88px; height: 34px; padding: 0; border: none; border-radius: 999px; background: transparent; cursor: grab; touch-action: none; z-index: 2; transform: translate({{menu.x}}px, {{menu.y}}px)">
<span style="position: absolute; left: 4px; top: 4px; width: 80px; height: 26px; box-sizing: border-box; border: 2px solid #d7b774; border-radius: 999px; background: radial-gradient(circle at 50% 25%, #6d1030 0%, #240611 85%); box-shadow: inset 0 0 0 1.5px #382510, 0 3px 0 #050204; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 5px">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{menu.o}}"></span>
<span aria-hidden="true" style="position: relative; display: flex; flex-direction: column; gap: 2.5px"><span style="display: block; width: 12px; height: 1.8px; border-radius: 2px; background: #f6e6be"></span><span style="display: block; width: 12px; height: 1.8px; border-radius: 2px; background: #f6e6be"></span><span style="display: block; width: 12px; height: 1.8px; border-radius: 2px; background: #f6e6be"></span></span>
<span style="position: relative; font-family: 'Cinzel', serif; font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #f6e6be">MENU</span>
</span>
</button>

<!-- System buttons: Map (-) and Pause (+) -->
<button type="button" aria-label="Minus button" onPointerDown="{{h.MINUS.down}}" onPointerUp="{{h.MINUS.up}}" onPointerCancel="{{h.MINUS.up}}" onClick="{{h.MINUS.click}}" style="position: absolute; left: 32px; top: 28px; width: 42px; height: 42px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.MINUS.y}}px)">
<span style="position: absolute; left: 2px; top: 2px; width: 38px; height: 38px; box-sizing: border-box; border: 2px solid #d7b774; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #7a1236 0%, #240611 85%); box-shadow: inset 0 0 0 1.5px #382510, 0 3px 0 #050204; overflow: hidden; display: flex; align-items: center; justify-content: center">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.MINUS.g}}"></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" style="position: relative"><path d="M3 6.5 L9 4 L15 6.5 L21 4 L21 17.5 L15 20 L9 17.5 L3 20 Z" fill="none" stroke="#f6e6be" stroke-width="2" stroke-linejoin="round"/><line x1="9" y1="4" x2="9" y2="17.5" stroke="#d7b774" stroke-width="1.5"/><line x1="15" y1="6.5" x2="15" y2="20" stroke="#d7b774" stroke-width="1.5"/></svg>
</span>
</button>
<button type="button" aria-label="Plus button" onPointerDown="{{h.PLUS.down}}" onPointerUp="{{h.PLUS.up}}" onPointerCancel="{{h.PLUS.up}}" onClick="{{h.PLUS.click}}" style="position: absolute; left: 841px; top: 28px; width: 42px; height: 42px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.PLUS.y}}px)">
<span style="position: absolute; left: 2px; top: 2px; width: 38px; height: 38px; box-sizing: border-box; border: 2px solid #d7b774; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #7a1236 0%, #240611 85%); box-shadow: inset 0 0 0 1.5px #382510, 0 3px 0 #050204; overflow: hidden; display: flex; align-items: center; justify-content: center">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.PLUS.g}}"></span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="position: relative"><rect x="6" y="4" width="4" height="16" rx="1.5" fill="#f6e6be"/><rect x="14" y="4" width="4" height="16" rx="1.5" fill="#f6e6be"/></svg>
</span>
</button>

<!-- Switch Sub-Weapon Left (L) & Right (R): compact 46px medallions -->
<button type="button" aria-label="L button" onPointerDown="{{h.L.down}}" onPointerUp="{{h.L.up}}" onPointerCancel="{{h.L.up}}" onClick="{{h.L.click}}" style="position: absolute; left: 26px; top: 148px; width: 46px; height: 46px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.L.y}}px)">
<span style="position: absolute; left: 0px; top: 0px; width: 46px; height: 46px; box-sizing: border-box; border: 2px solid #d7b774; border-radius: 50%; background: radial-gradient(circle at 35% 25%, #821238 0%, #220510 82%); box-shadow: inset 0 0 0 1.5px #362410, 0 3px 0 #050204; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
<span aria-hidden="true" style="position: absolute; left: 10%; top: 2px; width: 80%; height: 14px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 100%)"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.L.g}}"></span>
<span style="position: relative; font-family: 'Cinzel', serif; font-size: 7px; font-weight: 800; color: #f6e6be; line-height: 1">SUB L</span>
<svg aria-hidden="true" width="26" height="15" viewBox="0 0 36 20" style="position: relative"><polygon points="11,5 4,10 11,15 11,12 16,12 16,8 11,8" fill="#ebd296"/><path d="M19 15 L29 4 L31 6 L21 17 Z" fill="#f6e6be"/><path d="M18 11 L24 17" stroke="#d7b774" stroke-width="2" stroke-linecap="round"/></svg>
</span>
</button>
<button type="button" aria-label="R button" onPointerDown="{{h.R.down}}" onPointerUp="{{h.R.up}}" onPointerCancel="{{h.R.up}}" onClick="{{h.R.click}}" style="position: absolute; left: 96px; top: 148px; width: 46px; height: 46px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.R.y}}px)">
<span style="position: absolute; left: 0px; top: 0px; width: 46px; height: 46px; box-sizing: border-box; border: 2px solid #d7b774; border-radius: 50%; background: radial-gradient(circle at 35% 25%, #821238 0%, #220510 82%); box-shadow: inset 0 0 0 1.5px #362410, 0 3px 0 #050204; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
<span aria-hidden="true" style="position: absolute; left: 10%; top: 2px; width: 80%; height: 14px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 100%)"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.R.g}}"></span>
<span style="position: relative; font-family: 'Cinzel', serif; font-size: 7px; font-weight: 800; color: #f6e6be; line-height: 1">SUB R</span>
<svg aria-hidden="true" width="26" height="15" viewBox="0 0 36 20" style="position: relative"><path d="M5 15 L15 4 L17 6 L7 17 Z" fill="#f6e6be"/><path d="M4 11 L10 17" stroke="#d7b774" stroke-width="2" stroke-linecap="round"/><polygon points="25,5 32,10 25,15 25,12 20,12 20,8 25,8" fill="#ebd296"/></svg>
</span>
</button>

<!-- Character Swap Left (ZL) & Right (ZR): compact 48px medallions -->
<button type="button" aria-label="ZL trigger" onPointerDown="{{h.ZL.down}}" onPointerUp="{{h.ZL.up}}" onPointerCancel="{{h.ZL.up}}" onClick="{{h.ZL.click}}" style="position: absolute; left: 760px; top: 120px; width: 48px; height: 48px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.ZL.y}}px)">
<span style="position: absolute; left: 0px; top: 0px; width: 48px; height: 48px; box-sizing: border-box; border: 2px solid #d7b774; border-radius: 50%; background: radial-gradient(circle at 35% 25%, #8c123c 0%, #200614 82%); box-shadow: inset 0 0 0 1.5px #362410, 0 3px 0 #050204; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
<span aria-hidden="true" style="position: absolute; left: 10%; top: 2px; width: 80%; height: 15px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 100%)"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.ZL.g}}"></span>
<span style="position: relative; font-family: 'Cinzel', serif; font-size: 7px; font-weight: 800; color: #f6e6be; line-height: 1">SWAP L</span>
<svg aria-hidden="true" width="30" height="17" viewBox="0 0 40 24" style="position: relative"><circle cx="14" cy="7" r="3.2" fill="#f6e6be"/><path d="M8 15 C8 11.5 20 11.5 20 15 Z" fill="#f6e6be"/><circle cx="27" cy="7" r="3.2" fill="#d7b774"/><path d="M21 15 C21 11.5 33 11.5 33 15 Z" fill="#d7b774"/><polygon points="15,16 9,19.5 15,23 15,20.8 25,20.8 25,18.2 15,18.2" fill="#ebd296"/></svg>
</span>
</button>
<button type="button" aria-label="ZR trigger" onPointerDown="{{h.ZR.down}}" onPointerUp="{{h.ZR.up}}" onPointerCancel="{{h.ZR.up}}" onClick="{{h.ZR.click}}" style="position: absolute; left: 820px; top: 120px; width: 48px; height: 48px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.ZR.y}}px)">
<span style="position: absolute; left: 0px; top: 0px; width: 48px; height: 48px; box-sizing: border-box; border: 2px solid #d7b774; border-radius: 50%; background: radial-gradient(circle at 35% 25%, #8c123c 0%, #200614 82%); box-shadow: inset 0 0 0 1.5px #362410, 0 3px 0 #050204; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
<span aria-hidden="true" style="position: absolute; left: 10%; top: 2px; width: 80%; height: 15px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 100%)"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: {{accent}}; opacity: {{p.ZR.g}}"></span>
<span style="position: relative; font-family: 'Cinzel', serif; font-size: 7px; font-weight: 800; color: #f6e6be; line-height: 1">SWAP R</span>
<svg aria-hidden="true" width="30" height="17" viewBox="0 0 40 24" style="position: relative"><circle cx="13" cy="7" r="3.2" fill="#d7b774"/><path d="M7 15 C7 11.5 19 11.5 19 15 Z" fill="#d7b774"/><circle cx="26" cy="7" r="3.2" fill="#f6e6be"/><path d="M20 15 C20 11.5 32 11.5 32 15 Z" fill="#f6e6be"/><polygon points="25,16 31,19.5 25,23 25,20.8 15,20.8 15,18.2 25,18.2" fill="#ebd296"/></svg>
</span>
</button>

<!-- Ornate Gothic D-pad medallion (compact 138px, tighter arm gap) -->
<svg aria-hidden="true" width="138" height="138" viewBox="0 0 164 164" style="position: absolute; left: 37px; top: 227px">
<defs>
<radialGradient id="dpBg" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="#4e0c22"/><stop offset="70%" stop-color="#220610"/><stop offset="100%" stop-color="#120308"/></radialGradient>
<linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f5e1a4"/><stop offset="50%" stop-color="#b68d43"/><stop offset="100%" stop-color="#6b4d1b"/></linearGradient>
<radialGradient id="rubyGem" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#ff6b93"/><stop offset="45%" stop-color="#d41145"/><stop offset="100%" stop-color="#5e031b"/></radialGradient>
</defs>
<circle cx="82" cy="82" r="78" fill="url(#dpBg)" stroke="url(#goldRim)" stroke-width="5"/>
<circle cx="82" cy="82" r="71" fill="none" stroke="#362210" stroke-width="2"/>
<circle cx="82" cy="82" r="67" fill="none" stroke="#9d7b41" stroke-width="1.2" opacity="0.7"/>
<polygon points="82,58 89,75 106,82 89,89 82,106 75,89 58,82 75,75" fill="url(#goldRim)" stroke="#2b1a09" stroke-width="1.5"/>
<circle cx="82" cy="82" r="12" fill="url(#rubyGem)" stroke="#f5e1a4" stroke-width="2"/>
</svg>

<button type="button" aria-label="D-pad up" onPointerDown="{{h.UP.down}}" onPointerUp="{{h.UP.up}}" onPointerCancel="{{h.UP.up}}" onClick="{{h.UP.click}}" style="position: absolute; left: 86px; top: 233px; width: 40px; height: 44px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.UP.y}}px)">
<svg aria-hidden="true" width="40" height="44" viewBox="0 0 48 52">
<defs><linearGradient id="gU" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f2dc9b"/><stop offset="50%" stop-color="#c89f53"/><stop offset="100%" stop-color="#7c5b22"/></linearGradient></defs>
<polygon points="24,4 38,22 30,22 30,48 18,48 18,22 10,22" fill="url(#gU)" stroke="#2a1808" stroke-width="2" stroke-linejoin="round"/>
<polygon points="24,4 38,22 30,22 30,48 18,48 18,22 10,22" fill="{{accent}}" opacity="{{p.UP.g}}"/>
</svg>
</button>
<button type="button" aria-label="D-pad down" onPointerDown="{{h.DOWN.down}}" onPointerUp="{{h.DOWN.up}}" onPointerCancel="{{h.DOWN.up}}" onClick="{{h.DOWN.click}}" style="position: absolute; left: 86px; top: 315px; width: 40px; height: 44px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.DOWN.y}}px)">
<svg aria-hidden="true" width="40" height="44" viewBox="0 0 48 52">
<defs><linearGradient id="gD" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f2dc9b"/><stop offset="50%" stop-color="#c89f53"/><stop offset="100%" stop-color="#7c5b22"/></linearGradient></defs>
<polygon points="24,48 38,30 30,30 30,4 18,4 18,30 10,30" fill="url(#gD)" stroke="#2a1808" stroke-width="2" stroke-linejoin="round"/>
<polygon points="24,48 38,30 30,30 30,4 18,4 18,30 10,30" fill="{{accent}}" opacity="{{p.DOWN.g}}"/>
</svg>
</button>
<button type="button" aria-label="D-pad left" onPointerDown="{{h.LEFT.down}}" onPointerUp="{{h.LEFT.up}}" onPointerCancel="{{h.LEFT.up}}" onClick="{{h.LEFT.click}}" style="position: absolute; left: 43px; top: 276px; width: 44px; height: 40px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.LEFT.y}}px)">
<svg aria-hidden="true" width="44" height="40" viewBox="0 0 52 48">
<defs><linearGradient id="gL" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f2dc9b"/><stop offset="50%" stop-color="#c89f53"/><stop offset="100%" stop-color="#7c5b22"/></linearGradient></defs>
<polygon points="4,24 22,10 22,18 48,18 48,30 22,30 22,38" fill="url(#gL)" stroke="#2a1808" stroke-width="2" stroke-linejoin="round"/>
<polygon points="4,24 22,10 22,18 48,18 48,30 22,30 22,38" fill="{{accent}}" opacity="{{p.LEFT.g}}"/>
</svg>
</button>
<button type="button" aria-label="D-pad right" onPointerDown="{{h.RIGHT.down}}" onPointerUp="{{h.RIGHT.up}}" onPointerCancel="{{h.RIGHT.up}}" onClick="{{h.RIGHT.click}}" style="position: absolute; left: 125px; top: 276px; width: 44px; height: 40px; padding: 0; border: none; background: transparent; cursor: pointer; transform: translateY({{p.RIGHT.y}}px)">
<svg aria-hidden="true" width="44" height="40" viewBox="0 0 52 48">
<defs><linearGradient id="gR" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f2dc9b"/><stop offset="50%" stop-color="#c89f53"/><stop offset="100%" stop-color="#7c5b22"/></linearGradient></defs>
<polygon points="48,24 30,10 30,18 4,18 4,30 30,30 30,38" fill="url(#gR)" stroke="#2a1808" stroke-width="2" stroke-linejoin="round"/>
<polygon points="48,24 30,10 30,18 4,18 4,30 30,30 30,38" fill="{{accent}}" opacity="{{p.RIGHT.g}}"/>
</svg>
</button>

<!-- Right Action Arc: X=ATTACK (primary), A=JUMP, B=SUB-WEAPON, Y=RESCUE/PURGE -->
<!-- X: ATTACK -->
<button type="button" aria-label="X button" onPointerDown="{{h.X.down}}" onPointerUp="{{h.X.up}}" onPointerCancel="{{h.X.up}}" onClick="{{h.X.click}}" style="position: absolute; left: 734px; top: 266px; width: 78px; height: 78px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.X.y}}px)">
<span style="position: absolute; left: 0px; top: 0px; width: 78px; height: 78px; box-sizing: border-box; border: 3px solid #d7b774; border-radius: 50%; background: radial-gradient(circle at 38% 30%, #bd1246 0%, #5e0522 65%, #24030e 100%); box-shadow: inset 0 0 0 2px #362210, 0 5px 0 #050204; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;">
<span aria-hidden="true" style="position: absolute; left: 12%; top: 4px; width: 76%; height: 24px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0) 100%)"></span>
<span aria-hidden="true" style="position: absolute; inset: 4px; border-radius: 50%; border: 1px solid #f5e1a4; opacity: 0.45"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle, {{accent}} 0%, rgba(0,0,0,0) 72%); opacity: {{p.X.o}}"></span>
<svg aria-hidden="true" width="38" height="30" viewBox="0 0 40 30" style="position: relative; margin-top: -2px">
<path d="M8 26 L12 22 M9 18 L14 23" stroke="#ebd296" stroke-width="2.2" stroke-linecap="round"/>
<path d="M12 21 L29 3 L31 5 L15 23 Z" fill="#f6e6be"/>
<path d="M18 8 L14 2 M24 11 L32 8 M25 18 L32 21" stroke="#f5e1a4" stroke-width="1.6" stroke-linecap="round"/>
</svg>
<span style="position: relative; font-family: 'Cinzel', serif; font-size: 9.5px; font-weight: 800; letter-spacing: 0.8px; color: #f6e6be; text-shadow: 0 1px 2px #000; margin-top: -2px">ATTACK</span>
</span>
</button>

<!-- A: JUMP -->
<button type="button" aria-label="A button" onPointerDown="{{h.A.down}}" onPointerUp="{{h.A.up}}" onPointerCancel="{{h.A.up}}" onClick="{{h.A.click}}" style="position: absolute; left: 822px; top: 204px; width: 68px; height: 68px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: pointer; transform: translateY({{p.A.y}}px)">
<span style="position: absolute; left: 0px; top: 0px; width: 68px; height: 68px; box-sizing: border-box; border: 2.5px solid #d7b774; border-radius: 50%; background: radial-gradient(circle at 38% 30%, #b01242 0%, #56051f 68%, #22030d 100%); box-shadow: inset 0 0 0 2px #362210, 0 4px 0 #050204; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;">
<span aria-hidden="true" style="position: absolute; left: 12%; top: 4px; width: 76%; height: 22px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0) 100%)"></span>
<span aria-hidden="true" style="position: absolute; inset: 4px; border-radius: 50%; border: 1px solid #f5e1a4; opacity: 0.45"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle, {{accent}} 0%, rgba(0,0,0,0) 72%); opacity: {{p.A.o}}"></span>
<svg aria-hidden="true" width="32" height="28" viewBox="0 0 36 30" style="position: relative; margin-top: -1px">
<path d="M6 12 C9 6 16 5 18 11 C14 11 11 13 9 16 Z" fill="#f6e6be"/>
<path d="M18 11 L23 11 L23 20 L29 22 L29 26 L16 26 L16 14 Z" fill="#ebd296"/>
</svg>
<span style="position: relative; font-family: 'Cinzel', serif; font-size: 9px; font-weight: 800; letter-spacing: 0.8px; color: #f6e6be; text-shadow: 0 1px 2px #000; margin-top: -2px">JUMP</span>
</span>
</button>

<!-- B: SUB-WEAPON (54px) -->
